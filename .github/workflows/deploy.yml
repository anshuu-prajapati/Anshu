name: Deploy Portfolio to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /var/www/anshu

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            npm ci
            npm run build

            sudo rm -rf /var/www/anshu-site/*
            sudo cp -r dist/. /var/www/anshu-site/

            sudo chown -R www-data:www-data /var/www/anshu-site
